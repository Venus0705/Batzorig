<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title></title>

<style type="text/css">

img {

object-fit: cover;

width: 100%;

}

.test {

width: 300px;

height: 150px;

border: 1px solid black;

overflow: hidden;

}

div {

min-height: 100px;

}

.container {

margin: 0px auto;

width: 960px;

}

.col-3 {

float: left;

width: calc(100% / 4);

}

.col-6 {

float: left;

width: calc(100% / 2);

}

.col-12 {

float: left;

width: calc(100% / 1);

}

.top-navigation {

background-color: purple;

}

.logo {

background-color: red;

}

.header {

background-color: green;

}

.column1 {

background-color: blue;

}

.main {

background-color: brown;

}

.column3 {

background-color: cyan;

}

@media only screen and (max-width: 480px){

.container {

margin: 0px auto;

width: 100%;

}

.col-3 {

float: left;

clear: left;

width: calc(100% / 1);

}

.col-6 {

float: left;

clear: left;

width: calc(100% / 1);

}

.col-12 {

float: left;

clear: left;

width: calc(100% / 1);

}

}

</style>

</head>

<body>

<div class="container">

<div class="col-12 top-navigation"></div>

<div class="col-12 logo"></div>

<div class="col-12 header"></div>

<div class="col-3 column1"></div>

<div class="col-6 main"></div>

<div class="col-3 column3"></div>

</div>

</body>

</html>
